<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#f5f1eb" rx="4"/>

  <!-- Top color bar -->
  <rect x="0" y="0" width="8" height="3" fill="#005eb8"/>
  <rect x="8" y="0" width="8" height="3" fill="#e94e33"/>
  <rect x="16" y="0" width="8" height="3" fill="#fdb913"/>
  <rect x="24" y="0" width="8" height="3" fill="#008f4c"/>

  <!-- O -->
  <text x="5" y="24" font-family="'Anton', 'Impact', sans-serif" font-size="18" font-weight="900" fill="#1a1a1a">O</text>

  <!-- S in red -->
  <text x="15" y="24" font-family="'Anton', 'Impact', sans-serif" font-size="18" font-weight="900" fill="#e94e33">S</text>

  <!-- Arrow up — climb motif -->
