<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- NeoPop geometric pattern -->
    <pattern id="dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="rgba(0,0,0,0.15)"/>
    </pattern>
    <clipPath id="textClip">
      <rect x="0" y="0" width="400" height="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" fill="#f5f1eb" rx="0"/>

  <!-- Top color bar — CRED/NeoPop signature -->
  <rect x="0" y="0" width="100" height="4" fill="#005eb8"/>
  <rect x="100" y="0" width="100" height="4" fill="#e94e33"/>
  <rect x="200" y="0" width="100" height="4" fill="#fdb913"/>
  <rect x="300" y="0" width="100" height="4" fill="#008f4c"/>

  <!-- Geometric accent shapes — NeoPop style -->
  <!-- Red diamond -->
  <polygon points="365,25 380,40 365,55 350,40" fill="#e94e33" opacity="0.9"/>
  <!-- Blue circle -->
  <circle cx="385" cy="80" r="12" fill="#005eb8" opacity="0.85"/>
  <!-- Green square rotated -->
  <rect x="345" y="65" width="18" height="18" fill="#008f4c" opacity="0.85" transform="rotate(15 354 74)"/>
  <!-- Yellow small square -->
  <rect x="32" y="88" width="10" height="10" fill="#fdb913" opacity="0.9"/>

  <!-- Main text: OUT -->
  <text x="28" y="68" font-family="'Anton', 'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#1a1a1a" letter-spacing="-2">OUT</text>

  <!-- Main text: SCROLL with offset — NeoPop dimensional feel -->
  <text x="175" y="68" font-family="'Anton', 'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#e94e33" letter-spacing="-2">SCROLL</text>

  <!-- Shadow/depth layer for SCROLL — NeoPop 3D effect -->
  <text x="177" y="70" font-family="'Anton', 'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#1a1a1a" opacity="0.12" letter-spacing="-2">SCROLL</text>

  <!-- Tagline -->
  <text x="28" y="100" font-family="'Roboto Condensed', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" letter-spacing="4" opacity="0.7">CLIMB THE LADDER</text>

  <!-- Decorative line -->
  <line x1="28" y1="108" x2="200" y2="108" stroke="#e94e33" stroke-width="2" opacity="0.6"/>

  <!-- Dot pattern overlay for texture — NeoPop feel -->
  <rect width="400" height="120" fill="url(#dots)" opacity="0.3"/>
</svg>
