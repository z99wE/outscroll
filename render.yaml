# Render.com deployment config for OutScroll
# https://render.com/docs/render_yaml

services:
  # ========== BACKEND API ==========
  - type: web
    name: outscroll-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set to your Render frontend URL after deploy
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true

  # ========== FRONTEND (Static Site) ==========
  - type: static_site
    name: outscroll-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to your Render backend URL after deploy
