# OutScroll — Self-Hosted Docker Compose
# Run: docker-compose up -d
# Access: http://localhost:3000 (API), http://localhost:5175 (Frontend)

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outscroll
      POSTGRES_USER: outscroll
      POSTGRES_PASSWORD: ${DB_PASSWORD:-outscroll_secret_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outscroll -d outscroll"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://outscroll:${DB_PASSWORD:-outscroll_secret_change_me}@postgres:5432/outscroll
      JWT_SECRET: ${JWT_SECRET:-$(openssl rand -hex 32)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-$(openssl rand -hex 32)}
      ADMIN_KEY: ${ADMIN_KEY:-$(openssl rand -hex 32)}
      FRONTEND_URL: http://localhost:5175
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
